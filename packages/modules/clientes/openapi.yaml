openapi: 3.1.0
info:
  title: Aitrol ERP · Clientes
  version: 1.0.0
security:
  - BearerToken: []
paths:
  /api/v1/clientes:
    get:
      operationId: listarClientes
      summary: Buscar y listar clientes
      description: Requiere el permiso clientes:leer.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
          description: Búsqueda por nombre, identificación o correo.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de clientes.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Cliente' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
    post:
      operationId: registrarCliente
      summary: Registrar cliente
      description: Requiere el permiso clientes:escribir. El estado predeterminado es activo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosCliente' }
      responses:
        '201': { $ref: '#/components/responses/ClienteCreado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/IdentificacionDuplicada' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
  /api/v1/clientes/{cliente}:
    parameters:
      - name: cliente
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1, maximum: 999999999999999999 }
    get:
      operationId: consultarCliente
      summary: Consultar cliente
      description: Requiere el permiso clientes:leer.
      responses:
        '200': { $ref: '#/components/responses/Cliente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
    put:
      operationId: actualizarCliente
      summary: Actualizar o desactivar cliente
      description: Requiere el permiso clientes:escribir. Reemplaza los datos editables. Los campos de contacto omitidos se limpian.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/DatosCliente' }
                - { type: object, required: [activo] }
      responses:
        '200': { $ref: '#/components/responses/Cliente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/IdentificacionDuplicada' }
        '422': { $ref: '#/components/responses/Validacion' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
  responses:
    Cliente:
      description: Datos del cliente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RespuestaCliente' }
    ClienteCreado:
      description: Cliente registrado.
      headers:
        Location:
          schema: { type: string, format: uri }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RespuestaCliente' }
    NoAutenticado: { description: 'Token faltante, inválido, vencido o revocado.' }
    SinPermiso: { description: El token carece del permiso necesario. }
    NoEncontrado: { description: Cliente inexistente. }
    IdentificacionDuplicada: { description: El tipo y número de identificación ya existen. }
    Validacion: { description: Uno o más campos son inválidos. }
    LimiteExcedido: { description: Se superó el límite de peticiones. }
  schemas:
    RespuestaCliente:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Cliente' }
    Cliente:
      allOf:
        - { $ref: '#/components/schemas/DatosCliente' }
        - type: object
          required: [id, activo]
          properties:
            id: { type: integer, format: int64 }
    DatosCliente:
      type: object
      required: [tipo_identificacion, identificacion, nombre]
      properties:
        tipo_identificacion: { type: string, enum: [cedula, ruc, pasaporte] }
        identificacion:
          type: string
          maxLength: 30
          description: Cédula de 10 dígitos, RUC de 13 dígitos o pasaporte alfanumérico con guiones.
        nombre: { type: string, minLength: 1, maxLength: 160 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        telefono: { type: [string, 'null'], maxLength: 30 }
        direccion: { type: [string, 'null'], maxLength: 255 }
        activo: { type: boolean }
