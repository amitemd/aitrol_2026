  <title id="map-title">Esquema corporal oficial del examen físico</title>
  <desc id="map-description">Las siluetas originales del formulario 003 en vistas frontal, posterior y ambos perfiles, con regiones interactivas.</desc>
  <style>
    .view-label{fill:#597184;font:700 12px Arial,sans-serif;letter-spacing:1px}.region{--c:#087fab;cursor:pointer;outline:none}.hotspot{fill:var(--c);fill-opacity:0;stroke:var(--c);stroke-opacity:0;stroke-width:1.2;pointer-events:all;mix-blend-mode:multiply;transition:fill-opacity .18s}.region:not([data-exam-target="columna"]) .hotspot{stroke:none}.region:hover .hotspot,.region:focus .hotspot,.region.is-active .hotspot{fill-opacity:.16}.region.has-value .hotspot{fill-opacity:.32}.region[data-exam-target="ojos"] .hotspot,.region[data-exam-target="oidos"] .hotspot,.region[data-exam-target="nariz"] .hotspot,.region[data-exam-target="boca"] .hotspot{mix-blend-mode:normal}.region[data-exam-target="ojos"]:hover .hotspot,.region[data-exam-target="ojos"]:focus .hotspot,.region[data-exam-target="ojos"].is-active .hotspot,.region[data-exam-target="oidos"]:hover .hotspot,.region[data-exam-target="oidos"]:focus .hotspot,.region[data-exam-target="oidos"].is-active .hotspot,.region[data-exam-target="nariz"]:hover .hotspot,.region[data-exam-target="nariz"]:focus .hotspot,.region[data-exam-target="nariz"].is-active .hotspot,.region[data-exam-target="boca"]:hover .hotspot,.region[data-exam-target="boca"]:focus .hotspot,.region[data-exam-target="boca"].is-active .hotspot{fill-opacity:.38}.region[data-exam-target="ojos"].has-value .hotspot{fill-opacity:.68}.region[data-exam-target="oidos"].has-value .hotspot{fill-opacity:.58}.region[data-exam-target="nariz"].has-value .hotspot{fill-opacity:.62}.region[data-exam-target="boca"].has-value .hotspot{fill-opacity:.62}.region[data-exam-target="columna"]:hover .hotspot,.region[data-exam-target="columna"]:focus .hotspot,.region[data-exam-target="columna"].is-active .hotspot{stroke-opacity:.5}.region[data-exam-target="columna"].has-value .hotspot{stroke-opacity:.6}.figure{image-rendering:auto}
  </style>

